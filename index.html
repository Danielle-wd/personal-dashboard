<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Danielle">
<meta name="mobile-web-app-capable" content="yes">
<meta name="application-name" content="Danielle">
<meta name="theme-color" content="#f5f5f7">
<meta name="format-detection" content="telephone=no">
<link rel="apple-touch-icon" sizes="180x180" href="assets/icon-192.png">
<link rel="apple-touch-icon" sizes="167x167" href="assets/icon-192.png">
<link rel="apple-touch-icon" sizes="152x152" href="assets/icon-192.png">
<link rel="apple-touch-icon" sizes="120x120" href="assets/icon-192.png">
<link rel="icon" sizes="192x192" href="assets/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Danielle</title>
<style>
/* ===== Design Tokens ===== */
:root {
  --bg: #f5f5f7;
  --bg-card: #ffffff;
  --bg-sidebar: #fafafa;
  --text: #1d1d1f;
  --text-secondary: #86868b;
  --text-tertiary: #aeaeb2;
  --border: #e5e5ea;
  --border-light: #f0f0f5;
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.04);
  --shadow-md: 0 4px 16px rgba(0,0,0,0.06);
  --shadow-lg: 0 8px 32px rgba(0,0,0,0.08);
  --radius: 16px;
  --radius-sm: 12px;
  --radius-xs: 8px;
  --sidebar-width: 220px;
  --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Helvetica Neue", sans-serif;
}

/* ===== Module Theme Colors ===== */
.theme-todo      { --theme: #2563eb; --theme-light: #eff6ff; --theme-bg: #dbeafe; --theme-soft: #f0f5ff; }
.theme-notes     { --theme: #d97706; --theme-light: #fffbeb; --theme-bg: #fef3c7; --theme-soft: #fff8f0; }
.theme-english   { --theme: #7c3aed; --theme-light: #f5f3ff; --theme-bg: #ede9fe; --theme-soft: #f8f6ff; }
.theme-fitness   { --theme: #059669; --theme-light: #ecfdf5; --theme-bg: #d1fae5; --theme-soft: #f0fdf5; }
.theme-jobs      { --theme: #0d9488; --theme-light: #f0fdfa; --theme-bg: #ccfbf1; --theme-soft: #f0fdfa; }
.theme-media     { --theme: #e11d48; --theme-light: #fff1f2; --theme-bg: #ffe4e6; --theme-soft: #fff5f5; }
.theme-capture   { --theme: #f97316; --theme-light: #fff7ed; --theme-bg: #fed7aa; --theme-soft: #fff8f2; }
.theme-home      { --theme: #2563eb; --theme-light: #eff6ff; --theme-bg: #dbeafe; --theme-soft: #f0f5ff; }

/* ===== Reset ===== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; font-family: var(--font); font-size: 14px; color: var(--text); background: var(--bg); -webkit-font-smoothing: antialiased; overscroll-behavior: none; }
button { font-family: inherit; cursor: pointer; border: none; background: none; font-size: inherit; }
input, textarea, select { font-family: inherit; font-size: inherit; }
ul, ol { list-style: none; }
a { text-decoration: none; color: inherit; }

/* ===== App Layout ===== */
.app { display: flex; height: 100vh; height: 100dvh; overflow: hidden; }

/* ===== Sidebar (参考风格) ===== */
.sidebar {
  width: var(--sidebar-width);
  background: var(--bg-sidebar);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
  user-select: none;
}
.sidebar-brand {
  padding: 22px 20px 18px;
  display: flex;
  align-items: center;
  gap: 12px;
}
.sidebar-avatar {
  width: 38px; height: 38px;
  border-radius: 12px;
  background: linear-gradient(135deg, #2563eb 0%, #7c3aed 100%);
  display: flex; align-items: center; justify-content: center;
  color: #fff;
  font-weight: 700;
  font-size: 16px;
  flex-shrink: 0;
  box-shadow: 0 2px 6px rgba(37,99,235,0.25);
}
.sidebar-brand-info { display: flex; flex-direction: column; line-height: 1.2; }
.sidebar-brand-name { font-size: 15px; font-weight: 700; color: var(--text); letter-spacing: -0.2px; }
.sidebar-brand-tag { font-size: 11px; color: var(--text-tertiary); margin-top: 2px; }
.sidebar-divider { height: 1px; background: var(--border-light); margin: 0 16px 10px; }
.sidebar-nav { flex: 1; padding: 4px 12px; display: flex; flex-direction: column; gap: 2px; overflow-y: auto; }
.sidebar-nav::-webkit-scrollbar { width: 4px; }
.sidebar-nav::-webkit-scrollbar-thumb { background: transparent; }
.sidebar-nav:hover::-webkit-scrollbar-thumb { background: var(--border); }
.nav-label {
  font-size: 10px;
  font-weight: 700;
  color: var(--text-tertiary);
  text-transform: uppercase;
  letter-spacing: 1px;
  padding: 12px 12px 6px;
}
.nav-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 9px 12px;
  border-radius: var(--radius-xs);
  color: var(--text-secondary);
  transition: all var(--transition);
  font-size: 13.5px;
  font-weight: 450;
  cursor: pointer;
  position: relative;
}
.nav-item:hover { background: rgba(0,0,0,0.03); color: var(--text); }
.nav-item.active { background: var(--theme-light, #eff6ff); color: var(--theme, #2563eb); font-weight: 600; }
.nav-item.active .nav-icon { background: var(--theme-bg, #dbeafe); }
.nav-icon {
  font-size: 16px;
  width: 28px;
  height: 28px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 8px;
  flex-shrink: 0;
  transition: background var(--transition);
}
.nav-badge {
  margin-left: auto;
  background: var(--theme, #2563eb);
  color: #fff;
  font-size: 10px;
  padding: 1px 7px;
  border-radius: 10px;
  font-weight: 700;
  min-width: 18px;
  text-align: center;
}
.nav-item.active .nav-badge { background: var(--theme, #2563eb); color: #fff; }
.nav-item:not(.active) .nav-badge { background: var(--bg); color: var(--text-secondary); }
.nav-capture {
  margin-bottom: 4px;
}
.nav-capture:hover { background: var(--theme-light, #fff7ed); color: var(--theme, #f97316); }
.sidebar-footer {
  padding: 14px 20px;
  border-top: 1px solid var(--border-light);
  font-size: 12px;
  color: var(--text-tertiary);
  display: flex;
  align-items: center;
  gap: 6px;
}

/* ===== Main Content ===== */
.main {
  flex: 1;
  overflow-y: auto;
  padding: 32px 36px;
  -webkit-overflow-scrolling: touch;
}
.module-header {
  margin-bottom: 28px;
}
.module-title {
  font-size: 28px;
  font-weight: 750;
  letter-spacing: -0.6px;
  color: var(--text);
  display: flex;
  align-items: center;
  gap: 10px;
}
.module-title-icon {
  width: 36px; height: 36px;
  border-radius: 10px;
  background: var(--theme, #2563eb);
  display: flex; align-items: center; justify-content: center;
  font-size: 18px;
}
.module-desc {
  margin-top: 6px;
  color: var(--text-secondary);
  font-size: 14px;
  padding-left: 46px;
}

/* ===== Cards ===== */
.card {
  background: var(--bg-card);
  border-radius: var(--radius);
  padding: 22px;
  box-shadow: var(--shadow-sm);
  border: 1px solid var(--border-light);
  transition: all var(--transition);
}
.card:hover { box-shadow: var(--shadow-md); }
.card-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 18px;
}
.card-header h3 { font-size: 15px; font-weight: 650; color: var(--text); }

/* Card variants for visual hierarchy */
.card-primary {
  border-color: var(--theme-bg, #dbeafe);
  background: linear-gradient(135deg, var(--bg-card) 0%, var(--theme-light, #eff6ff) 100%);
}
.card-featured {
  border-left: 4px solid var(--theme, #2563eb);
  background: var(--theme-soft, #f0f5ff);
}
.card-inline {
  padding: 14px 18px;
  border-radius: var(--radius-xs);
  border: 1px solid var(--border-light);
  margin-bottom: 8px;
}
.card-dim {
  opacity: 0.65;
}

/* ===== Grid ===== */
.grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
.grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
.grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }

/* ===== Buttons ===== */
.btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 9px 18px; border-radius: var(--radius-xs);
  font-size: 13px; font-weight: 550; transition: all var(--transition);
  white-space: nowrap;
}
.btn-primary {
  background: var(--theme, #2563eb);
  color: #fff;
  box-shadow: 0 2px 8px rgba(37,99,235,0.25);
}
.btn-primary:hover { filter: brightness(1.1); transform: translateY(-1px); box-shadow: 0 4px 14px rgba(37,99,235,0.35); }
.btn-secondary { background: var(--bg); color: var(--text); border: 1px solid var(--border); }
.btn-secondary:hover { background: var(--border-light); border-color: var(--theme, #2563eb); color: var(--theme, #2563eb); }
.btn-danger { color: #e11d48; }
.btn-danger:hover { background: #fff1f2; }
.btn-sm { padding: 6px 12px; font-size: 12px; }
.btn-icon { width: 34px; height: 34px; padding: 0; justify-content: center; border-radius: var(--radius-xs); }
.btn-outline {
  border: 1.5px solid var(--theme, #2563eb);
  color: var(--theme, #2563eb);
  background: transparent;
}
.btn-outline:hover { background: var(--theme-light, #eff6ff); }

/* ===== Forms ===== */
.input, .select {
  padding: 10px 14px; border: 1.5px solid var(--border); border-radius: var(--radius-xs);
  background: #fff; color: var(--text); transition: all var(--transition);
  width: 100%; outline: none; font-size: 14px;
}
.input:focus, .select:focus { border-color: var(--theme, #2563eb); box-shadow: 0 0 0 4px var(--theme-light, #eff6ff); }
.select { cursor: pointer; appearance: none; background-image: url("data:image/svg+xml,%3Csvg width='10' height='6' viewBox='0 0 10 6' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1L5 5L9 1' stroke='%2386868b' stroke-width='1.5' stroke-linecap='round'/%3E%3C/svg%3E"); background-repeat: no-repeat; background-position: right 12px center; padding-right: 32px; }
.textarea { resize: vertical; min-height: 80px; }

/* ===== Tags ===== */
.tag {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 3px 12px; border-radius: 20px; font-size: 12px; font-weight: 500;
  letter-spacing: 0.1px;
}
.tag-blue { background: #eff6ff; color: #2563eb; }
.tag-green { background: #ecfdf5; color: #059669; }
.tag-orange { background: #fff7ed; color: #ea580c; }
.tag-purple { background: #f5f3ff; color: #7c3aed; }
.tag-red { background: #fff1f2; color: #e11d48; }
.tag-gray { background: #f4f4f5; color: #71717a; }
.tag-teal { background: #f0fdfa; color: #0d9488; }

/* Priority tags */
.tag-important { background: #fef2f2; color: #dc2626; font-weight: 600; border: 1px solid #fecaca; }
.tag-normal { background: #f8fafc; color: #64748b; }
.tag-urgent { background: #fff7ed; color: #ea580c; font-weight: 600; border: 1px solid #fed7aa; animation: pulse-tag 2s infinite; }
@keyframes pulse-tag { 0%,100% { opacity: 1; } 50% { opacity: 0.7; } }

/* ===== Todo Kanban ===== */
.kanban { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
.kanban-col {
  background: var(--theme-soft, #f0f5ff);
  border-radius: var(--radius);
  padding: 18px;
  min-height: 300px;
  transition: background var(--transition);
}
.kanban-col:hover { background: var(--theme-light, #eff6ff); }
.kanban-col-title {
  font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px;
  color: var(--theme, #2563eb); margin-bottom: 14px;
  display: flex; align-items: center; gap: 8px;
}
.kanban-col-title .count {
  background: var(--theme, #2563eb);
  color: #fff;
  font-size: 10px;
  padding: 1px 8px;
  border-radius: 10px;
}
.kanban-item {
  background: #fff; border-radius: var(--radius-sm); padding: 14px;
  margin-bottom: 10px; border: 1px solid var(--border-light);
  cursor: pointer; transition: all var(--transition);
  position: relative;
}
.kanban-item:hover { box-shadow: var(--shadow-md); transform: translateY(-1px); border-color: var(--theme, #2563eb); }
.kanban-item-title { font-size: 14px; font-weight: 550; margin-bottom: 6px; color: var(--text); }
.kanban-item-meta { font-size: 11px; color: var(--text-tertiary); display: flex; gap: 10px; align-items: center; }
.kanban-item-date.overdue { color: #dc2626; font-weight: 650; }

/* ===== Notes ===== */
.note-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 16px; }
.note-card {
  background: #fff; border-radius: var(--radius-sm); padding: 18px;
  border: 1px solid var(--border-light); transition: all var(--transition); cursor: pointer;
}
.note-card:hover { box-shadow: var(--shadow-md); border-color: var(--theme, #d97706); }
.note-card-title { font-weight: 650; font-size: 15px; margin-bottom: 8px; color: var(--text); }
.note-card-preview { font-size: 13px; color: var(--text-secondary); line-height: 1.6; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.note-card-footer { margin-top: 12px; display: flex; gap: 6px; flex-wrap: wrap; }
.note-card-date { font-size: 11px; color: var(--text-tertiary); margin-top: 8px; }

/* ===== English ===== */
.english-tabs { display: flex; gap: 2px; margin-bottom: 18px; background: var(--theme-soft, #f8f6ff); border-radius: var(--radius-xs); padding: 4px; width: fit-content; }
.english-tab {
  padding: 7px 18px; border-radius: var(--radius-xs); font-size: 13px; color: var(--text-secondary);
  cursor: pointer; transition: all var(--transition); font-weight: 500;
}
.english-tab.active { background: #fff; color: var(--theme, #7c3aed); box-shadow: var(--shadow-sm); font-weight: 650; }
.stat-card { text-align: center; padding: 22px; }
.stat-card.primary { background: linear-gradient(135deg, var(--bg-card) 0%, var(--theme-light, #f5f3ff) 100%); }
.stat-number { font-size: 34px; font-weight: 750; letter-spacing: -1.5px; color: var(--theme, #7c3aed); }
.stat-label { font-size: 12px; color: var(--text-tertiary); margin-top: 4px; font-weight: 500; }
.review-card { border-left: 4px solid var(--theme, #7c3aed); padding-left: 18px; background: var(--theme-soft, #f8f6ff); }
.problem-card {
  border-radius: var(--radius-sm);
  padding: 16px;
  margin-bottom: 10px;
  border: 1px solid var(--border-light);
  background: #fff;
  transition: all var(--transition);
}

/* ===== Fitness ===== */
.weight-chart-wrap { width: 100%; height: 260px; }
.checkin-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; }
.checkin-day {
  aspect-ratio: 1; border-radius: 10px; display: flex; align-items: center; justify-content: center;
  font-size: 12px; color: var(--text-tertiary); border: 1.5px solid var(--border-light);
  cursor: pointer; transition: all var(--transition); position: relative;
  font-weight: 500;
}
.checkin-day.done { background: var(--theme, #059669); color: #fff; border-color: var(--theme, #059669); }
.checkin-day.today { border-color: var(--theme, #059669); font-weight: 700; color: var(--theme, #059669); background: var(--theme-light, #ecfdf5); }
.checkin-day:hover { border-color: var(--theme, #059669); transform: scale(1.1); }
.workout-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 14px 0;
  border-bottom: 1px solid var(--border-light);
  transition: background var(--transition);
}
.workout-item:hover { background: var(--theme-light, #ecfdf5); margin: 0 -12px; padding-left: 12px; padding-right: 12px; border-radius: 6px; }

/* ===== Jobs ===== */
.job-card { padding: 18px; border-left: 4px solid var(--border); cursor: pointer; transition: all var(--transition); }
.job-card:hover { border-left-width: 6px; }
.job-card.status-applied { border-left-color: var(--theme, #0d9488); }
.job-card.status-interview { border-left-color: #f59e0b; }
.job-card.status-offer { border-left-color: #10b981; }
.job-card.status-rejected { border-left-color: #ef4444; }
.job-industry { font-size: 11px; }
.job-date { font-size: 12px; color: var(--text-tertiary); }

/* ===== Media ===== */
.media-idea-card {
  background: linear-gradient(145deg, var(--bg-card) 0%, var(--theme-light, #fff1f2) 100%);
  border: 1px solid var(--border-light); border-radius: var(--radius-sm); padding: 18px;
  cursor: pointer; transition: all var(--transition);
}
.media-idea-card:hover { box-shadow: var(--shadow-md); transform: translateY(-2px); }
.idea-score { font-size: 24px; font-weight: 750; letter-spacing: -1px; }
.idea-score.hot { color: var(--theme, #e11d48); }
.idea-score.good { color: #f59e0b; }
.idea-score.ok { color: #64748b; }
.metrics-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
.metric-card { background: var(--theme-soft, #fff5f5); border-radius: var(--radius-sm); padding: 18px; text-align: center; }

/* ===== Modal ===== */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.4); display: flex;
  align-items: center; justify-content: center; z-index: 100;
  animation: fadeIn 0.15s ease;
  backdrop-filter: blur(2px);
}
.modal {
  background: #fff; border-radius: var(--radius); padding: 28px;
  width: 92%; max-width: 520px; max-height: 80vh; overflow-y: auto;
  box-shadow: var(--shadow-lg); animation: slideUp 0.2s ease;
}
.modal-title { font-size: 20px; font-weight: 700; margin-bottom: 20px; color: var(--text); }
.modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 22px; }
.form-group { margin-bottom: 16px; }
.form-label { display: block; font-size: 13px; font-weight: 600; color: var(--text-secondary); margin-bottom: 6px; }
.form-hint { font-size: 12px; color: var(--text-tertiary); margin-top: 4px; }

@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes slideUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }

/* ===== Toast ===== */
.toast {
  position: fixed; bottom: 32px; left: 50%; transform: translateX(-50%);
  background: var(--text); color: #fff; padding: 12px 24px; border-radius: var(--radius-xs);
  font-size: 13px; z-index: 200; animation: fadeIn 0.2s ease; box-shadow: var(--shadow-lg);
  font-weight: 500; letter-spacing: 0.2px;
}

/* ===== Section Divider ===== */
.section-title {
  font-size: 13px;
  font-weight: 700;
  color: var(--text-tertiary);
  text-transform: uppercase;
  letter-spacing: 1px;
  margin: 28px 0 14px;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--border-light);
}

/* ===== Empty State ===== */
.empty {
  text-align: center; padding: 48px 20px; color: var(--text-tertiary);
}
.empty-icon { font-size: 40px; margin-bottom: 12px; opacity: 0.6; }
.empty-text { font-size: 14px; }

/* ===== Scrollbar ===== */
.main::-webkit-scrollbar { width: 6px; }
.main::-webkit-scrollbar-track { background: transparent; }
.main::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
.main::-webkit-scrollbar-thumb:hover { background: var(--text-tertiary); }

.hidden { display: none !important; }

/* ===== Mobile Bottom Tab Bar ===== */
.mobile-nav { display: none; }

@media (max-width: 768px) {
  .app { flex-direction: row; overflow: hidden; }

  /* Sidebar: always visible, compact icon mode */
  .sidebar {
    display: flex !important;
    width: 54px;
    min-width: 54px;
    border-right: 1px solid var(--border);
    background: var(--bg-sidebar);
    padding: 0;
    overflow-y: auto;
  }
  .sidebar-brand { padding: 12px 0; justify-content: center; flex-shrink: 0; }
  .sidebar-avatar { width: 32px; height: 32px; border-radius: 8px; font-size: 14px; }
  .sidebar-brand-info { display: none; }
  .sidebar-nav { padding: 2px 6px; gap: 4px; align-items: center; }
  .nav-label { display: none; }
  .sidebar-divider { margin: 4px 8px; }
  .nav-item {
    width: 42px; height: 42px;
    padding: 0;
    gap: 0;
    justify-content: center;
    border-radius: 10px;
    font-size: 0;
  }
  .nav-item .nav-icon {
    font-size: 18px;
    width: 30px; height: 30px;
    border-radius: 8px;
  }
  .nav-item.active { background: var(--theme-light, #eff6ff); }
  .nav-item.active .nav-icon { background: var(--theme-bg, #dbeafe); }
  .nav-badge {
    position: absolute;
    top: -2px; right: -2px;
    font-size: 9px;
    padding: 1px 5px;
    min-width: 16px;
    height: 16px;
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    line-height: 1;
  }
  .nav-capture {
    margin-bottom: 2px;
  }
  .nav-capture .nav-icon { font-size: 16px; }
  .sidebar-footer { display: none; }

  /* Sidebar hide scrollbar */
  .sidebar::-webkit-scrollbar { width: 0; }

  /* Main content fills remaining space */
  .main {
    flex: 1;

/* ===== Capture Module ===== */
.capture-hero {
  text-align: center;
  padding: 12px 0 24px;
}
.capture-input-wrap {
  display: flex;
  gap: 10px;
  max-width: 640px;
  margin: 0 auto 16px;
}
.capture-input {
  flex: 1;
  padding: 14px 18px;
  border: 2px solid var(--border);
  border-radius: var(--radius);
  font-size: 15px;
  background: #fff;
  transition: all var(--transition);
  outline: none;
}
.capture-input:focus {
  border-color: var(--theme, #f97316);
  box-shadow: 0 0 0 4px var(--theme-light, #fff7ed);
}
.capture-input::placeholder { color: var(--text-tertiary); }
.capture-btn {
  padding: 14px 24px;
  border-radius: var(--radius);
  font-size: 15px;
  font-weight: 650;
  background: var(--theme, #f97316);
  color: #fff;
  box-shadow: 0 2px 12px rgba(249,115,22,0.3);
  transition: all var(--transition);
  white-space: nowrap;
}
.capture-btn:hover { filter: brightness(1.1); transform: translateY(-1px); }
.capture-fetch-status {
  font-size: 12px;
  color: var(--text-tertiary);
  min-height: 18px;
  transition: all var(--transition);
}
.capture-fetch-status.success { color: #059669; }
.capture-fetch-status.error { color: #e11d48; }

.capture-categories {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  justify-content: center;
  margin-bottom: 8px;
}
.capture-cat {
  padding: 6px 14px;
  border-radius: 20px;
  font-size: 12px;
  font-weight: 550;
  border: 1.5px solid var(--border);
  background: #fff;
  color: var(--text-secondary);
  cursor: pointer;
  transition: all var(--transition);
}
.capture-cat:hover { border-color: var(--theme, #f97316); color: var(--theme, #f97316); }
.capture-cat.selected {
  background: var(--theme, #f97316);
  color: #fff;
  border-color: var(--theme, #f97316);
}

.capture-quick-tags {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  justify-content: center;
  margin-bottom: 20px;
}
.capture-quick-tag {
  padding: 3px 10px;
  border-radius: 14px;
  font-size: 11px;
  background: var(--theme-soft, #fff8f2);
  color: var(--theme, #f97316);
  cursor: pointer;
  transition: all var(--transition);
  border: 1px solid transparent;
}
.capture-quick-tag:hover { border-color: var(--theme, #f97316); }
.capture-quick-tag.active { background: var(--theme, #f97316); color: #fff; }

.capture-history { margin-top: 8px; }
.capture-history-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 16px;
  border-radius: var(--radius-xs);
  border: 1px solid var(--border-light);
  margin-bottom: 6px;
  transition: all var(--transition);
  cursor: pointer;
}
.capture-history-item:hover { border-color: var(--theme, #f97316); background: var(--theme-soft, #fff8f2); }
.capture-history-source {
  width: 28px; height: 28px;
  border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  font-size: 14px;
  flex-shrink: 0;
}
.capture-history-source.xiaohongshu { background: #ffe4e6; }
.capture-history-source.douyin { background: #1a1a2e; color: #fff; font-size: 12px; }
.capture-history-source.manual { background: #f0f0f5; }
.capture-history-info { flex: 1; min-width: 0; }
.capture-history-title { font-size: 13px; font-weight: 550; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.capture-history-meta { font-size: 11px; color: var(--text-tertiary); display: flex; gap: 8px; }
.capture-history-arrow { color: var(--text-tertiary); }

.capture-source-hint {
  display: flex;
  gap: 12px;
  justify-content: center;
  margin-top: 16px;
  flex-wrap: wrap;
}
.capture-source-chip {
  display: flex;
  align-items: center;
  gap: 5px;
  font-size: 12px;
  color: var(--text-tertiary);
  padding: 4px 10px;
  background: var(--bg);
  border-radius: 20px;
}

/* ===== Home Dashboard Module ===== */
.home-greeting {
  padding: 12px 4px 24px;
}
.greeting-title {
  font-size: 28px;
  font-weight: 750;
  letter-spacing: -0.6px;
  color: var(--text);
  display: flex;
  align-items: center;
  gap: 10px;
}
.greeting-wave {
  display: inline-block;
  animation: wave 2.5s ease-in-out infinite;
  transform-origin: 70% 70%;
}
@keyframes wave {
  0%, 60%, 100% { transform: rotate(0deg); }
  10%, 30% { transform: rotate(14deg); }
  20%, 40% { transform: rotate(-8deg); }
  50% { transform: rotate(4deg); }
}
.greeting-subtitle {
  margin-top: 6px;
  color: var(--text-secondary);
  font-size: 14px;
}
.greeting-datetime {
  margin-top: 14px;
  display: flex;
  gap: 12px;
  font-size: 13px;
  color: var(--text-tertiary);
}
.greeting-datetime span { display: inline-flex; align-items: center; gap: 4px; }

.home-stats {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 14px;
  margin-bottom: 24px;
}
.home-stat {
  background: var(--bg-card);
  border-radius: var(--radius);
  padding: 20px;
  border: 1px solid var(--border-light);
  box-shadow: var(--shadow-sm);
  cursor: pointer;
  transition: all var(--transition);
}
.home-stat:hover { box-shadow: var(--shadow-md); transform: translateY(-2px); border-color: var(--theme, #2563eb); }
.home-stat-icon {
  width: 44px; height: 44px;
  border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
  font-size: 22px;
  background: var(--theme-light, #eff6ff);
  margin-bottom: 14px;
}
.home-stat-value {
  font-size: 30px;
  font-weight: 750;
  letter-spacing: -1.5px;
  color: var(--text);
  line-height: 1;
}
.home-stat-value .unit { font-size: 14px; color: var(--text-tertiary); font-weight: 500; margin-left: 2px; }
.home-stat-label { font-size: 13px; color: var(--text-secondary); margin-top: 6px; font-weight: 500; }
.home-stat-trend { font-size: 11px; margin-top: 8px; color: var(--text-tertiary); }

.home-actions {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  margin-bottom: 28px;
}
.home-action-btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 10px 18px;
  border-radius: 24px;
  border: 1px solid var(--border);
  background: #fff;
  font-size: 13px;
  font-weight: 550;
  color: var(--text);
  cursor: pointer;
  transition: all var(--transition);
}
.home-action-btn:hover { border-color: var(--theme, #2563eb); color: var(--theme, #2563eb); transform: translateY(-1px); }
.home-action-btn.primary {
  background: var(--theme, #2563eb);
  color: #fff;
  border-color: var(--theme, #2563eb);
  box-shadow: 0 2px 8px rgba(37,99,235,0.25);
}
.home-action-btn.primary:hover { filter: brightness(1.1); color: #fff; }

.home-recent {
  display: grid;
  grid-template-columns: 2fr 1fr;
  gap: 16px;
}
.home-recent-list { display: flex; flex-direction: column; gap: 8px; }
.home-recent-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px;
  background: var(--bg-card);
  border: 1px solid var(--border-light);
  border-radius: var(--radius-sm);
  transition: all var(--transition);
  cursor: pointer;
}
.home-recent-item:hover { box-shadow: var(--shadow-md); border-color: var(--theme, #2563eb); }
.home-recent-icon {
  width: 36px; height: 36px;
  border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  font-size: 16px;
  flex-shrink: 0;
}
.home-recent-info { flex: 1; min-width: 0; }
.home-recent-title { font-size: 14px; font-weight: 550; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.home-recent-meta { font-size: 11px; color: var(--text-tertiary); margin-top: 2px; }

@media (max-width: 768px) {
  .home-stats { grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .home-stat { padding: 14px; }
  .home-stat-value { font-size: 22px; }
  .home-stat-icon { width: 36px; height: 36px; font-size: 18px; }
  .home-recent { grid-template-columns: 1fr; }
  .greeting-title { font-size: 22px; }
  .home-action-btn { padding: 8px 14px; font-size: 12px; }
}
